<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#060410">
<title>Votre devis — François Leterrier</title>
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" href="favicon-180.png">
<link rel="preload" as="font" type="font/woff2" href="/fonts/fraunces-500-latin.woff2" crossorigin>
<link rel="preload" href="/fonts.css" as="style" onload="this.rel='stylesheet'"><noscript><link rel="stylesheet" href="/fonts.css"></noscript>
<link rel="stylesheet" href="/aurora.css">
<link rel="stylesheet" href="pages.css">
<style>
  .devis-page{padding:26px 0 60px}
  .devis-back{font-size:13px;color:var(--muted);margin-bottom:14px;display:inline-block}.devis-back a{color:var(--cyan);text-decoration:none}
  .devis-state{max-width:820px;margin:40px auto;text-align:center;color:var(--muted)}
  .devis-state .sp{width:30px;height:30px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--cyan);animation:dvs .8s linear infinite;display:inline-block;vertical-align:middle;margin-right:10px}
  @keyframes dvs{to{transform:rotate(360deg)}}
  /* le document lui-même : clair, façon vrai devis, imprimable */
  .devis-doc{max-width:820px;margin:0 auto;background:#fff;color:#1e1e24;border-radius:14px;padding:44px 46px;box-shadow:0 30px 80px -40px rgba(0,0,0,.7);font-family:'Montserrat',system-ui,sans-serif;line-height:1.6}
  .dv-top{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;border-bottom:2px solid #eceaf2;padding-bottom:22px}
  .dv-prov b{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:20px;color:#141018;display:block;margin-bottom:4px}
  .dv-prov,.dv-prov a{color:#55505f;font-size:13px}.dv-prov a{text-decoration:none}
  .dv-meta{text-align:right}
  .dv-meta .t{font-family:'Fraunces',serif;font-weight:600;font-size:30px;color:#141018;letter-spacing:.02em}
  .dv-meta .n{font-size:13px;color:#8a8594;margin-top:2px}
  .dv-client{margin:22px 0 6px;background:#f6f5f9;border-radius:10px;padding:16px 18px}
  .dv-client .l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#8a8594;font-weight:700}
  .dv-client .v{font-size:15px;color:#241f2c;margin-top:4px}
  table.dv-items{width:100%;border-collapse:collapse;margin:22px 0 6px;font-size:14.5px}
  table.dv-items th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#8a8594;border-bottom:2px solid #eceaf2;padding:0 0 9px}
  table.dv-items th.r,table.dv-items td.r{text-align:right;white-space:nowrap}
  table.dv-items td{padding:12px 0;border-bottom:1px solid #f0eef4;color:#2a2531}
  .dv-tot{display:flex;justify-content:flex-end;margin-top:12px}
  .dv-tot .box{min-width:340px;max-width:100%}
  .dv-tot .row{display:flex;justify-content:space-between;gap:18px;padding:6px 0;font-size:14.5px;color:#55505f}
  .dv-tot .row span{min-width:0}.dv-tot .row.grand b,.dv-tot .row>span:last-child{white-space:nowrap}
  .dv-tot .row.grand{border-top:2px solid #eceaf2;margin-top:6px;padding-top:12px;font-size:18px;color:#141018;font-weight:800}
  .dv-tot .row.grand b{font-family:'Fraunces',serif}
  .dv-tot .mo{color:#7c3aed;font-weight:700}
  .dv-cond{margin:20px 0 0;font-size:12.5px;color:#77727f;line-height:1.7;border-top:1px solid #f0eef4;padding-top:16px}
  .dv-msg{margin:14px 0 0;font-size:13.5px;color:#443f4d;background:#f6f5f9;border-radius:10px;padding:12px 15px}
  /* signature */
  .dv-sign{margin:26px 0 0;border-top:2px dashed #e2dfea;padding-top:22px}
  .dv-sign h3{font-family:'Fraunces',serif;font-weight:600;font-size:18px;color:#141018;margin:0 0 4px}
  .dv-sign p{font-size:13px;color:#77727f;margin:0 0 14px}
  .dv-sign .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .dv-sign input[type=text]{flex:1;min-width:220px;border:1.5px solid #dcd8e6;border-radius:10px;padding:12px 14px;font:inherit;font-size:15px;color:#241f2c}
  .dv-sign input[type=text]:focus{outline:none;border-color:#7c3aed;box-shadow:0 0 0 3px rgba(124,58,237,.14)}
  .dv-consent{display:flex;gap:9px;align-items:flex-start;margin:12px 0 14px;font-size:13px;color:#55505f}
  .dv-btn{border:0;cursor:pointer;font:inherit;font-family:'Montserrat',sans-serif;font-weight:700;font-size:15px;color:#fff;background:linear-gradient(90deg,#28c8dd,#7c3aed 55%,#e05bc8);padding:14px 26px;border-radius:12px}
  .dv-btn[disabled]{opacity:.6;cursor:progress}
  .dv-signed{margin:26px 0 0;border-top:2px solid #37d67a;padding-top:20px;background:linear-gradient(120deg,rgba(55,214,122,.08),transparent);border-radius:0 0 10px 10px}
  .dv-signed .stamp{display:inline-flex;align-items:center;gap:10px;color:#1c8a4a;font-weight:800;font-size:16px}
  .dv-signed .who{font-family:'Fraunces',serif;font-size:22px;color:#141018;margin:8px 0 2px}
  .dv-msg-out{margin-top:12px;font-size:14px}
  .devis-actions{max-width:820px;margin:18px auto 0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .ghostbtn{border:1px solid var(--line);background:transparent;color:#cfd6e6;font:inherit;font-weight:600;font-size:14px;padding:13px 20px;border-radius:12px;cursor:pointer;text-decoration:none}
  @media(max-width:600px){.devis-doc{padding:30px 22px}.dv-meta{text-align:left}}
  @media print{header.top,footer,.devis-actions,.devis-back,#flburger{display:none!important}body{background:#fff}.devis-doc{box-shadow:none;border-radius:0;max-width:none;margin:0;padding:0}.devis-page{padding:0}}
</style>
</head>
<body>
  <a class="skiplink" href="#contenu">Aller au contenu</a>
  <header class="top"><div class="wrap">
    <a class="brand" href="index.html"><img src="logo.png" alt="Logo FL — François Leterrier" width="40" height="40">François Leterrier<small>Community Manager · Web</small></a>
    <a class="back" href="index.html">← Accueil</a>
  </div></header>

  <main id="contenu"><section class="devis-page"><div class="wrap">
    <span class="devis-back"><a href="configurateur.html">← Modifier ma configuration</a></span>
    <div class="devis-state" id="dv-state"><span class="sp"></span> Chargement de votre devis…</div>
    <div id="dv-doc"></div>
    <div class="devis-actions" id="dv-actions" hidden>
      <button class="ghostbtn" onclick="window.print()">🖨️ Enregistrer en PDF</button>
      <a class="ghostbtn" href="contact.html">Une question ? Me contacter</a>
    </div>
  </div></section></main>

  <footer><div class="wrap">François Leterrier · Community manager &amp; création de site · Lavernose-Lacasse 31410 · <a href="tel:+33698200208">06 98 20 02 08</a> — © <span id="y">2026</span> · <a href="mentions-legales.html">Mentions légales</a></div></footer>

  <script>document.getElementById('y').textContent=new Date().getFullYear();</script>
  <script src="/devis.js" defer></script>
  <script src="/consent.js" defer></script>
</body>
</html>
