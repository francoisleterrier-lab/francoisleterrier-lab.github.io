# fl-api — Worker socle pour francoisleterrier.fr
# account_id / zone_id / KV id / D1 database_id renseignés. R2 = fl-assets.
# Account ID / Zone ID = identifiants de config (pas des secrets).
# Les clés API/LLM ne vont JAMAIS ici → `wrangler secret put …`.

name = "main"
main = "src/index.js"
compatibility_date = "2026-07-01"
# API servie via l'URL *.workers.dev pour l'instant (le DNS du domaine est
# encore chez OVH → Cloudflare pas autoritaire). Quand les nameservers seront
# basculés sur Cloudflare, on repassera sur un domaine personnalisé
# api.francoisleterrier.fr (custom_domain).
workers_dev = true
account_id = "f64ba9ca7e5fc6e0d3f22eb9f97445d9"

# Synchro auto des avis Google : DÉSACTIVÉE (diagnostic complet effectué).
# La fiche de François est une activité « zone de service » sans adresse publique :
# elle n'est PAS exposée par l'API Google Places (NOT_FOUND par nom, par téléphone
# ET par place_id — elle n'existe que dans le Knowledge Panel de la recherche, qui
# n'a pas d'API). Le compteur d'avis est donc géré en statique dans le HTML (à jour).
# Pour réactiver l'auto-fetch si Google indexe la fiche un jour :
#   [vars]
#   MY_REVIEWS_AUTOFETCH = "1"
#   MY_PLACE_ID = "…"   # place_id renvoyé par une vraie réponse Places (pas construit)

# Workers AI — LLM intégré (aucune clé externe). Utilisé par /generate.
[ai]
binding = "AI"

# KV — cache des générations/audits + rate-limit anti-abus.
# Créer : wrangler kv namespace create fl_cache
[[kv_namespaces]]
binding = "CACHE"
id = "7e811eb092344ece87afd751161813d7"

# D1 — base relationnelle (tables leads, maquettes, audits, geo_checks).
# Créer : wrangler d1 create fl_data   puis   wrangler d1 execute fl_data --file=schema.sql --remote
[[d1_databases]]
binding = "DB"
database_name = "fl_data"
database_id = "4b7434c3-4baa-4f2b-8171-3a1902920226"

# R2 — assets générés (images, PDF de devis/audit). Egress gratuit.
# Créer : wrangler r2 bucket create fl-assets
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "fl-assets"
