<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#060410">
<title>Leads — Tableau de bord privé</title>
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<style>
  :root{--bg:#08060f;--bg2:#0f0b1c;--panel:#16122a;--line:rgba(143,230,240,.12);--line2:rgba(143,230,240,.22);--txt:#f2ecf4;--muted:#a49db8;--cyan:#28c8dd;--purple:#7c3aed;--magenta:#e05bc8;--grad:linear-gradient(90deg,#28c8dd,#7c3aed 55%,#e05bc8);--green:#37d67a;--amber:#f0a04b;--red:#ff6b6b;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Montserrat',system-ui,sans-serif;background:radial-gradient(120% 80% at 50% -10%,#181233,transparent 60%),var(--bg);color:var(--txt);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
  .wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
  a{color:var(--cyan);text-decoration:none}
  .ad-top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}
  .ad-top h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
  .ad-top small{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em}
  .ad-actions{display:flex;gap:8px;flex-wrap:wrap}
  button,.btn{font:inherit;cursor:pointer}
  .gbtn{border:1px solid var(--line2);background:rgba(255,255,255,.03);color:var(--txt);font-size:13px;font-weight:600;padding:9px 15px;border-radius:10px;transition:.15s}
  .gbtn:hover{border-color:var(--cyan)}
  .pbtn{border:0;background:var(--grad);color:#08111f;font-weight:700;font-size:14px;padding:11px 20px;border-radius:10px}
  /* login */
  .ad-card{max-width:420px;margin:8vh auto 0;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px}
  .ad-card h2{font-size:20px;margin-bottom:6px}
  .ad-card p{color:var(--muted);font-size:14px;margin-bottom:18px}
  .ad-card form{display:flex;gap:10px;flex-wrap:wrap}
  input,select{font:inherit;background:rgba(255,255,255,.05);border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;color:var(--txt);font-size:14px}
  input:focus,select:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(40,200,221,.16)}
  .ad-card input{flex:1;min-width:200px}
  .ad-msg{margin-top:12px;font-size:13.5px;min-height:18px}
  /* stats */
  .ad-stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:20px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px}
  .stat .n{font-size:26px;font-weight:800;line-height:1}
  .stat .l{font-size:11.5px;color:var(--muted);margin-top:5px;font-weight:600;letter-spacing:.02em}
  .stat.big .n{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  /* toolbar */
  .ad-toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .ad-toolbar input{flex:1;min-width:220px}
  /* table */
  .ad-tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:820px}
  th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;position:sticky;top:0;background:#1a1530}
  tr:last-child td{border-bottom:0}
  tr:hover td{background:rgba(255,255,255,.02)}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .b-audit{background:rgba(40,200,221,.14);color:var(--cyan)}
  .b-generateur{background:rgba(124,58,237,.18);color:#b79bff}
  .b-devis{background:rgba(224,91,200,.16);color:#f0a6df}
  .b-assistant{background:rgba(55,214,122,.15);color:#6fe6a3}
  .b-parrainage{background:rgba(240,160,75,.16);color:#f0b46b}
  .b-abonnement{background:rgba(99,102,241,.18);color:#a5b4fc}
  .b-acompte{background:rgba(99,102,241,.14);color:#c7d2fe}
  .b-other{background:rgba(255,255,255,.08);color:var(--muted)}
  .em{font-weight:600;word-break:break-all}
  .sub{color:var(--muted);font-size:12px;margin-top:2px}
  .score{font-weight:800}
  .st-sel{font-size:12.5px;font-weight:600;padding:6px 8px;border-radius:8px}
  .st-nouveau{border-color:var(--line2)}
  .st-contacte{border-color:var(--amber);color:var(--amber)}
  .st-converti{border-color:var(--green);color:var(--green)}
  .st-perdu{border-color:var(--red);color:var(--red)}
  .dt{color:var(--muted);white-space:nowrap;font-size:12.5px}
  .ad-empty{padding:40px;text-align:center;color:var(--muted)}
  .muted{color:var(--muted)}
  /* espaces clients */
  .esp-panel{margin-top:34px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
  .esp-panel h2{font-size:18px;font-weight:800}
  .esp-panel h2 small{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.03em;margin-top:3px}
  #esp-form{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 6px}
  #esp-form input{flex:1;min-width:220px}
  .esp-msg{font-size:13px;min-height:16px;margin:4px 0}
  .esp-list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
  .esp-item{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:rgba(255,255,255,.02)}
  .esp-item .en{font-weight:700}
  .esp-item .el{color:var(--cyan);font-size:12.5px;word-break:break-all}
  .esp-item .ea{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .esp-copy{border:1px solid var(--line2);background:rgba(255,255,255,.03);color:var(--txt);font-size:12px;font-weight:600;padding:7px 12px;border-radius:9px}
  .esp-del{border:1px solid var(--red);background:transparent;color:var(--red);font-size:12px;font-weight:600;padding:7px 12px;border-radius:9px}
  @media(max-width:820px){.ad-stats{grid-template-columns:1fr 1fr 1fr}}
  @media(max-width:520px){.ad-stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="ad-top">
      <div><h1>🎯 Tableau de bord — Leads<small>Audit &amp; Générateur · privé</small></h1></div>
      <div class="ad-actions" id="ad-actions" hidden>
        <button class="gbtn" id="ad-refresh">↻ Actualiser</button>
        <button class="gbtn" id="ad-export">⤓ Export CSV</button>
        <button class="gbtn" id="ad-logout">Déconnexion</button>
      </div>
    </div>

    <section class="ad-card" id="ad-login">
      <h2>Accès privé</h2>
      <p>Entrez votre clé d'accès pour consulter les leads captés.</p>
      <form id="ad-login-form" autocomplete="off">
        <input type="password" id="ad-token" placeholder="Clé d'accès" autocomplete="current-password" aria-label="Clé d'accès">
        <button class="pbtn" type="submit">Entrer</button>
      </form>
      <div class="ad-msg" id="ad-login-msg" role="status"></div>
    </section>

    <section id="ad-dash" hidden>
      <div class="ad-stats" id="ad-stats"></div>
      <div class="ad-toolbar">
        <input id="ad-search" placeholder="Rechercher (e-mail, ville, métier, site…)" aria-label="Rechercher">
        <select id="ad-source" aria-label="Filtrer par source">
          <option value="">Toutes sources</option>
          <option value="audit">Audit</option>
          <option value="generateur">Générateur</option>
          <option value="assistant">Assistant</option>
          <option value="parrainage">Parrainage</option>
          <option value="devis">Devis</option>
          <option value="abonnement">Abonnement</option>
          <option value="acompte">Acompte</option>
        </select>
        <select id="ad-status-filter" aria-label="Filtrer par statut">
          <option value="">Tous statuts</option>
          <option value="nouveau">Nouveau</option>
          <option value="contacte">Contacté</option>
          <option value="converti">Converti</option>
          <option value="perdu">Perdu</option>
        </select>
      </div>
      <div class="ad-tablewrap">
        <table>
          <thead><tr><th>Date</th><th>Source</th><th>Contact</th><th>Détail</th><th>Statut</th></tr></thead>
          <tbody id="ad-rows"></tbody>
        </table>
      </div>
      <div class="ad-empty" id="ad-empty" hidden>Aucun lead pour le moment.</div>

      <section class="esp-panel" id="ad-espaces">
        <h2>📊 Espaces clients <small>Tableaux de bord Looker Studio · liens privés</small></h2>
        <form id="esp-form" autocomplete="off">
          <input type="text" id="esp-nom" placeholder="Nom du client (ex. Boulangerie Dupont)" aria-label="Nom du client">
          <input type="url" id="esp-url" placeholder="URL du rapport Looker Studio (lookerstudio.google.com/…)" aria-label="URL du rapport Looker Studio">
          <button class="pbtn" type="submit">Créer / mettre à jour</button>
        </form>
        <div class="esp-msg" id="esp-msg" role="status"></div>
        <div id="esp-list" class="esp-list"></div>
      </section>
    </section>
  </div>
  <script src="/admin.js" defer></script>
</body>
</html>
