name: Contrôle SEO
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - name: Contrôles SEO (liens, titres, JSON-LD, FAQ, sitemap)
        run: python3 tools/check-seo.py
